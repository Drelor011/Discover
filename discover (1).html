<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discover — персональные рекомендации</title>
<style>
:root{
  --bg:#0a0a0f; --bg2:#0e0e16; --surf:#15151f; --surf2:#1c1c28; --surf3:#232332;
  --line:#2a2a3a; --text:#f3f3f7; --muted:#9a9aab; --dim:#6b6b7c;
  --accent:#ff3d57; --accent2:#ff8a3d; --gold:#f5c518; --blue:#4f8cff;
  --grad: linear-gradient(135deg,#ff3d57 0%,#ff8a3d 100%);
  --grad-soft: linear-gradient(135deg, rgba(255,61,87,.18), rgba(255,138,61,.18));
  --r:14px; --r-sm:8px; --r-lg:22px;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --font:'Inter','Segoe UI','Helvetica Neue',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--font);
  -webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(255,138,61,.10), transparent 60%),
    radial-gradient(900px 500px at -10% 100%, rgba(79,140,255,.08), transparent 60%),
    radial-gradient(700px 400px at 50% 50%, rgba(255,61,87,.04), transparent 70%);
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{max-width:100%}
input{font-family:inherit}

/* Layout */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{
  background:var(--bg2);border-right:1px solid var(--line);
  padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:6px;
}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 18px;font-weight:800;font-size:20px;letter-spacing:.5px}
.brand .dot{
  width:28px;height:28px;border-radius:8px;background:var(--grad);
  display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px;box-shadow:0 4px 14px rgba(255,61,87,.5)
}
.nav-section{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);padding:14px 10px 6px}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
  color:var(--muted);font-weight:500;font-size:14px;transition:.15s;width:100%;text-align:left;
}
.nav-item:hover{background:var(--surf);color:var(--text)}
.nav-item.active{background:var(--surf3);color:var(--text)}
.nav-item .ico{font-size:16px;width:22px;text-align:center}
.nav-item .badge{margin-left:auto;background:var(--surf3);color:var(--muted);font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.nav-item.active .badge{background:var(--accent);color:#fff}

.main{padding:24px 32px 80px;min-width:0}
.topbar{
  display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap;
}
.search{
  flex:1;min-width:220px;display:flex;align-items:center;gap:10px;
  background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px 14px;
}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,61,87,.12)}
.search input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:15px}
.search input::placeholder{color:var(--dim)}
.search .ico{color:var(--dim)}
.topbar-actions{display:flex;align-items:center;gap:10px}
.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;
  background:var(--surf);border:1px solid var(--line);color:var(--text);transition:.15s;
}
.btn:hover{background:var(--surf2);border-color:#3a3a4d}
.btn-primary{background:var(--grad);border:none;color:#fff;box-shadow:0 6px 18px rgba(255,61,87,.3)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:transparent}
.btn-sm{padding:8px 12px;font-size:13px}

/* Hero */
.hero{
  position:relative;border-radius:var(--r-lg);overflow:hidden;margin-bottom:30px;
  background:var(--surf);min-height:340px;display:flex;align-items:flex-end;
  border:1px solid var(--line);
}
.hero-bg{position:absolute;inset:0;z-index:0;opacity:.85}
.hero-bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,var(--bg) 0%,rgba(10,10,15,.6) 35%,transparent 70%),
             linear-gradient(180deg,transparent 30%,rgba(10,10,15,.92) 100%);
}
.hero-content{position:relative;z-index:1;padding:30px;max-width:620px}
.hero-kicker{font-size:12px;letter-spacing:2px;color:var(--accent2);font-weight:700;text-transform:uppercase;margin-bottom:10px}
.hero-title{font-size:clamp(28px,4vw,46px);font-weight:900;line-height:1.05;margin-bottom:10px}
.hero-meta{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.hero-meta .star{color:var(--gold);font-weight:700}
.hero-desc{color:#d8d8e0;font-size:15px;line-height:1.6;max-width:540px;margin-bottom:18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.tag{
  display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;
  background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--muted);
}

/* Rows */
.row{margin-bottom:30px}
.row-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:14px}
.row-title{font-size:20px;font-weight:800;letter-spacing:.3px}
.row-title .ico{margin-right:8px}
.row-meta{color:var(--dim);font-size:13px;font-weight:500}
.row-scroll{
  display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
}
.row-scroll::-webkit-scrollbar{height:6px}
.row-scroll::-webkit-scrollbar-thumb{background:var(--surf3);border-radius:3px}
.row-scroll::-webkit-scrollbar-track{background:transparent}

/* Card */
.card{
  flex:0 0 200px;scroll-snap-align:start;border-radius:var(--r);overflow:hidden;
  background:var(--surf);border:1px solid var(--line);cursor:pointer;transition:transform .2s,border-color .2s;position:relative;
}
.card:hover{transform:translateY(-3px);border-color:#3a3a4d}
.poster{
  position:relative;aspect-ratio:2/3;background:var(--surf2);display:grid;place-items:center;
  overflow:hidden;
}
.poster .glyph{
  font-size:46px;font-weight:900;color:rgba(255,255,255,.92);
  text-shadow:0 4px 14px rgba(0,0,0,.5);letter-spacing:1px;
  padding:14px;text-align:center;line-height:1.1;
}
.poster .cat-stripe{
  position:absolute;top:10px;left:10px;font-size:11px;padding:3px 9px;border-radius:20px;
  background:rgba(10,10,15,.55);backdrop-filter:blur(6px);color:#fff;font-weight:600;
}
.poster .top-rating{
  position:absolute;top:10px;right:10px;font-size:12px;font-weight:700;color:#1a1a1f;
  background:var(--gold);padding:3px 8px;border-radius:20px;
}
.card-body{padding:12px 12px 14px}
.card-title{font-size:14px;font-weight:700;line-height:1.25;margin-bottom:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.card-sub{font-size:12px;color:var(--dim)}
.card-actions{
  position:absolute;inset:auto 0 0 0;display:flex;justify-content:flex-end;gap:6px;
  padding:8px;background:linear-gradient(180deg,transparent,rgba(10,10,15,.85));opacity:0;transition:opacity .2s;
}
.card:hover .card-actions{opacity:1}
.mini-btn{
  width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.12);
  backdrop-filter:blur(6px);display:grid;place-items:center;font-size:14px;
  border:1px solid rgba(255,255,255,.18);transition:.15s;
}
.mini-btn:hover{background:rgba(255,255,255,.22);transform:scale(1.08)}
.mini-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mini-btn.on-sv{background:var(--blue);border-color:var(--blue);color:#fff}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,5,10,.78);backdrop-filter:blur(8px);
  z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
  max-width:760px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);
  animation:slideup .25s;
}
@keyframes slideup{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.modal-poster{aspect-ratio:16/9;position:relative;background:var(--surf2);display:grid;place-items:center;overflow:hidden}
.modal-poster .glyph{font-size:80px;font-weight:900;color:#fff;text-shadow:0 6px 22px rgba(0,0,0,.55)}
.modal-poster::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 50%,var(--bg2) 100%)}
.modal-body{padding:26px;position:relative;margin-top:-30px;z-index:1}
.modal-cat{font-size:12px;letter-spacing:2px;color:var(--accent2);text-transform:uppercase;font-weight:700;margin-bottom:6px}
.modal-title{font-size:28px;font-weight:900;line-height:1.1;margin-bottom:4px}
.modal-orig{color:var(--dim);font-size:14px;margin-bottom:12px}
.modal-meta{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.modal-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.modal-desc{color:#d8d8e0;font-size:15px;line-height:1.7;margin-bottom:22px}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap}
.similar-head{font-size:14px;font-weight:700;margin:22px 0 12px;color:var(--muted)}
.similar-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}

/* Onboarding */
.onb{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
.onb.open{display:flex}
.onb-card{
  max-width:760px;width:100%;background:var(--bg2);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:34px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow);
}
.onb-brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;margin-bottom:6px}
.onb-brand .dot{
  width:34px;height:34px;border-radius:10px;background:var(--grad);
  display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(255,61,87,.45)
}
.onb-sub{color:var(--muted);font-size:14px;margin-bottom:24px}
.onb-step{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent2);font-weight:700;margin:20px 0 10px}
.onb-cats{display:flex;flex-direction:column;gap:18px;margin-bottom:24px}
.onb-cath{font-size:14px;font-weight:700;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:8px 14px;border-radius:20px;background:var(--surf);border:1px solid var(--line);
  font-size:13px;color:var(--muted);cursor:pointer;transition:.15s;user-select:none;
}
.chip:hover{border-color:#3a3a4d;color:var(--text)}
.chip.on{background:var(--grad-soft);border-color:var(--accent);color:var(--text);font-weight:600}
.onb-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:8px}
.onb-status{color:var(--dim);font-size:13px}

/* Toast */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  background:var(--surf3);border:1px solid var(--line);color:var(--text);
  padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:var(--shadow);
  animation:slideup .25s;display:flex;align-items:center;gap:10px;
}
.toast .ico{color:var(--accent)}

/* Empty state */
.empty{padding:50px 20px;text-align:center;color:var(--dim)}
.empty .ico{font-size:48px;margin-bottom:14px;opacity:.4}
.empty p{font-size:15px;margin-bottom:6px}
.empty .hint{font-size:13px}

/* Responsive */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{
    position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;overflow-y:visible;
    border-right:none;border-bottom:1px solid var(--line);padding:12px;gap:4px;z-index:30;
  }
  .brand{padding:0 12px 0 4px;border:none}
  .nav-section{display:none}
  .nav-item{flex:0 0 auto;padding:8px 12px;font-size:13px}
  .nav-item .badge{display:none}
  .main{padding:18px 16px 70px}
  .hero{min-height:280px}
  .card{flex-basis:160px}
}
@media (max-width:560px){
  .hero-content{padding:20px}
  .modal-body{padding:20px}
  .card{flex-basis:140px}
  .poster .glyph{font-size:32px}
  .row-title{font-size:17px}
}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div class="search">
        <span class="ico">🔍</span>
        <input id="search" type="text" placeholder="Поиск по названию, жанру, году…" autocomplete="off">
      </div>
      <div class="topbar-actions">
        <button class="btn btn-sm" id="btnReset">↺ Заново</button>
        <button class="btn btn-primary btn-sm" id="btnTop">✦ Персонально</button>
      </div>
    </div>
    <div id="feed"></div>
  </main>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal"></div>
</div>

<div class="onb" id="onb">
  <div class="onb-card" id="onbCard"></div>
</div>

<div class="toast-wrap" id="toasts"></div>

// ---------- State ----------
const LS_KEY = 'discover_state_v1';
const state = {
  prefs: null,
  ratings: {},
  saved: {},
  seen: {},
};
function load(){
  try{ const raw = JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(raw){ Object.assign(state, raw); } }catch(e){}
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
load();

const { items, cats, catIcons, genresByCat } = DATA;
const byId = Object.fromEntries(items.map(i=>[i.id,i]));

// ---------- Helpers ----------
function affinities(){
  const a = {};
  const bump = (g,w)=>{ a[g]=(a[g]||0)+w; };
  if(state.prefs && state.prefs.genres){
    state.prefs.genres.forEach(g=>bump(g,1.0));
  }
  items.forEach(it=>{
    const r = state.ratings[it.id];
    if(r==='like') it.genres.forEach(g=>bump(g,0.6));
    else if(r==='dislike') it.genres.forEach(g=>bump(g,-0.5));
  });
  return a;
}
function score(it, aff){
  if(state.ratings[it.id] || state.seen[it.id]) return -Infinity;
  let base = 0;
  it.genres.forEach(g=>{ base += (aff[g]||0); });
  base = base / Math.sqrt(it.genres.length);
  base += (it.rating-7.0)*0.15;
  return base;
}
function topRecommendations(n=12){
  const aff = affinities();
  return items
    .map(it=>({it, s: score(it, aff)}))
    .filter(x=>x.s>0)
    .sort((a,b)=>b.s-a.s)
    .slice(0,n)
    .map(x=>x.it);
}
function filterByCat(cat){ return items.filter(it=>it.cat===cat); }
function liked(){ return items.filter(it=>state.ratings[it.id]==='like'); }
function saved(){ return items.filter(it=>state.saved[it.id]); }

function gradFor(it){
  let h=0; for(const c of it.id) h=(h*31+c.charCodeAt(0))>>>0;
  const palettes = [
    ['#ff3d57','#ff8a3d'],['#4f8cff','#7c3aed'],['#00d4c8','#3a7bd5'],
    ['#f5c518','#ff7a18'],['#7a3aff','#ff3da7'],['#3affaa','#0e7c7b'],
    ['#ff6a3d','#ff3d6a'],['#5b8cff','#3da7ff'],['#9b3dff','#ff3dc1'],
    ['#3d7bff','#5be7ff'],['#ff9a3d','#ff3d57'],['#3dffa5','#3d9bff'],
  ];
  const p = palettes[h % palettes.length];
  return `linear-gradient(135deg, ${p[0]}, ${p[1]})`;
}
function glyphFor(it){
  const t = it.title.replace(/^(The|A|Le|La|El|Господин|Г-жа)\s+/i,'').trim();
  const words = t.split(/\s+/);
  if(words.length>=2) return (words[0][0]+words[1][0]).toUpperCase();
  return t.slice(0,2).toUpperCase();
}

// ---------- Render: Card ----------
function card(it){
  const liked = state.ratings[it.id]==='like';
  const sv = !!state.saved[it.id];
  return `
    <div class="card" data-id="${it.id}">
      <div class="poster" style="background:${gradFor(it)}">
        <div class="cat-stripe">${catIcons[it.cat]||''} ${it.cat}</div>
        <div class="top-rating">★ ${it.rating.toFixed(1)}</div>
        <div class="glyph">${glyphFor(it)}</div>
        <div class="card-actions">
          <button class="mini-btn ${liked?'on':''}" data-act="like" data-id="${it.id}" title="Нравится">${liked?'♥':'♡'}</button>
          <button class="mini-btn ${sv?'on-sv':''}" data-act="save" data-id="${it.id}" title="Сохранить">${sv?'★':'☆'}</button>
        </div>
      </div>
      <div class="card-body">
        <div class="card-title">${it.title}</div>
        <div class="card-sub">${it.year} · ${it.genres.slice(0,2).join(', ')}</div>
      </div>
    </div>`;
}
function row(title, list, opts={}){
  if(!list || !list.length) return '';
  const meta = opts.meta || `${list.length} элементов`;
  const ico = opts.ico || '';
  return `
    <div class="row">
      <div class="row-head">
        <div class="row-title">${ico} ${title}</div>
        <div class="row-meta">${meta}</div>
      </div>
      <div class="row-scroll">${list.map(it=>card(it)).join('')}</div>
    </div>`;
}

function renderSidebar(){
  const counts = {};
  cats.forEach(c=>counts[c]=filterByCat(c).length);
  const nav = cats.map(c=>`
    <button class="nav-item" data-cat="${c}">
      <span class="ico">${catIcons[c]}</span><span>${c}</span>
      <span class="badge">${counts[c]}</span>

  const likedC = liked().length;
  const svC = saved().length;
  document.getElementById('sidebar').innerHTML = `
    <div class="brand"><span class="dot">D</span><span>Discover</span></div>
    <div class="nav-section">Лента</div>
    <button class="nav-item active" data-cat="ALL"><span class="ico">✦</span><span>Главная</span></button>
    <div class="nav-section">Категории</div>
    ${nav}
    <div class="nav-section">Ваши подборки</div>
    <button class="nav-item" data-cat="LIKED"><span class="ico">♥</span><span>Понравилось</span><span class="badge">${likedC}</span></button>
    <button class="nav-item" data-cat="SAVED"><span class="ico">★</span><span>Сохранённое</span><span class="badge">${svC}</span></button>
    <button class="nav-item" data-cat="TOP"><span class="ico">⚡</span><span>Персональные</span></button>

      window.scrollTo({top:0,behavior:'smooth'});
    });

}

// ---------- Render: Feed ----------
let currentCat = 'ALL';
let currentQuery = '';

function heroItem(){
  const rec = topRecommendations(1)[0] || items[0];
  return rec;
}
function heroHTML(it){
  return `
    <div class="hero">
      <div class="hero-bg" style="background:${gradFor(it)}"></div>
      <div class="hero-content">
        <div class="hero-kicker">✦ Рекомендация для вас · ${it.cat}</div>
        <div class="hero-title">${it.title}</div>
        <div class="hero-meta">
          <span>${it.year}</span>
          <span class="star">★ ${it.rating.toFixed(1)}</span>
          <span>${it.genres.join(' · ')}</span>
        </div>
        <div class="hero-desc">${it.desc}</div>
        <div class="hero-actions">
          <button class="btn btn-primary" data-open="${it.id}">▷ Подробнее</button>
          <button class="btn btn-ghost" data-act="like" data-id="${it.id}">${state.ratings[it.id]==='like'?'♥ Нравится':'♡ Нравится'}</button>
          <button class="btn btn-ghost" data-act="save" data-id="${it.id}">${state.saved[it.id]?'★ Сохранено':'☆ Сохранить'}</button>
        </div>
      </div>
    </div>`;
}

function renderFeed(){
  const feed = document.getElementById('feed');
  const q = currentQuery.trim().toLowerCase();
  let pool = items;
  if(currentCat==='LIKED') pool = liked();
  else if(currentCat==='SAVED') pool = saved();
  else if(currentCat==='TOP') pool = [];
  else if(currentCat!=='ALL') pool = filterByCat(currentCat);
  if(q){
    pool = pool.filter(it =>
      it.title.toLowerCase().includes(q) ||
      it.orig.toLowerCase().includes(q) ||
      String(it.year).includes(q) ||
      it.genres.some(g=>g.toLowerCase().includes(q)) ||
      it.cat.toLowerCase().includes(q)
    );
  }

  if(currentCat==='TOP'){
    const rec = topRecommendations(30);
    if(!rec.length){
      feed.innerHTML = `<div class="empty"><div class="ico">⚡</div><p>Пока не хватает данных для подбора.</p><p class="hint">Оцените несколько произведений — и лента персональных рекомендаций оживёт.</p></div>`;
      return;
    }
    const top = rec.slice(0,18);
    const rest = rec.slice(18);
    feed.innerHTML = heroHTML(top[0]) + row('Персонально для вас', top, {ico:'✦', meta:`${rec.length} рекомендаций`}) + (rest.length?row('Ещё варианты', rest, {ico:'⁞', meta:`${rest.length} элементов`}):'');
    return;
  }

  if(currentCat==='LIKED'){
    if(!pool.length){ feed.innerHTML = `<div class="empty"><div class="ico">♥</div><p>Вы ещё ничего не отметили как нравящееся.</p><p class="hint">Нажмите ♡ на карточке — и подборка начнёт расти.</p></div>`; return; }
    feed.innerHTML = row('Вам понравилось', pool, {ico:'♥', meta:`${pool.length} элементов`});
    return;
  }
  if(currentCat==='SAVED'){
    if(!pool.length){ feed.innerHTML = `<div class="empty"><div class="ico">★</div><p>Здесь появятся произведения, которые вы сохранили на потом.</p><p class="hint">Нажмите ☆ на карточке — и подборка начнёт расти.</p></div>`; return; }
    feed.innerHTML = row('Сохранённое', pool, {ico:'★', meta:`${pool.length} элементов`});
    return;
  }

  if(q && !pool.length){ feed.innerHTML = `<div class="empty"><div class="ico">🔍</div><p>Ничего не найдено по запросу «${escapeHtml(currentQuery)}».</p><p class="hint">Попробуйте смягчить запрос или сменить категорию.</p></div>`; return; }

  let html = '';
  if(currentCat==='ALL' && !q){
    const h = heroItem();
    html += heroHTML(h);
    const rec = topRecommendations(18);
    if(rec.length) html += row('Персонально для вас', rec, {ico:'✦', meta:'по вашим вкусам'});
    cats.forEach(c=>{
      const list = filterByCat(c);
      html += row(c, list, {ico:catIcons[c], meta:`${list.length} элементов`});
    });
  } else {
    if(currentCat==='ALL'){
      cats.forEach(c=>{
        const list = pool.filter(it=>it.cat===c);
        if(list.length) html += row(c, list, {ico:catIcons[c], meta:`${list.length} элементов`});
      });
    } else {
      html += row(currentCat, pool, {ico:catIcons[currentCat], meta:`${pool.length} элементов`});
    }
  }
  feed.innerHTML = html;
}

function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function openModal(id){
  const it = byId[id]; if(!it) return;
  const liked = state.ratings[id]==='like';
  const sv = !!state.saved[id];
  const aff = affinities();

    .filter(x=>x.id!==id && x.cat===it.cat && x.genres.some(g=>it.genres.includes(g)))
    .map(x=>({x, s: score(x,aff)+0.1}))
    .sort((a,b)=>b.s-a.s).slice(0,6).map(x=>x.x);
  const html = `
    <div class="modal-poster" style="background:${gradFor(it)}">
      <div class="glyph">${glyphFor(it)}</div>
    </div>
    <div class="modal-body">
      <div class="modal-cat">${catIcons[it.cat]} ${it.cat}</div>
      <div class="modal-title">${it.title}</div>
      <div class="modal-orig">${it.orig}</div>
      <div class="modal-meta">
        <span>${it.year}</span>
        <span class="star" style="color:var(--gold);font-weight:700">★ ${it.rating.toFixed(1)}</span>
        <span>${it.genres.join(' · ')}</span>
      </div>
      <div class="modal-tags">${it.genres.map(g=>`<span class="tag">${g}</span>`).join('')}</div>
      <div class="modal-desc">${it.desc}</div>
      <div class="modal-actions">
        <button class="btn btn-primary" data-act="like" data-id="${id}">${liked?'♥ Вам нравится':'♡ Нравится'}</button>
        <button class="btn" data-act="save" data-id="${id}">${sv?'★ Сохранено':'☆ Сохранить'}</button>
        <button class="btn" data-act="dismiss" data-id="${id}">Не интересно</button>
      </div>
      ${similar.length?`<div class="similar-head">Похожее</div><div class="similar-row">${similar.map(x=>card(x)).join('')}</div>`:''}
    </div>`;
  document.getElementById('modal').innerHTML = html;
  document.getElementById('modalBg').classList.add('open');
}

function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }

// ---------- Onboarding ----------
function openOnboarding(){
  const preSel = (state.prefs && state.prefs.genres) || [];
  const sel = new Set(preSel);
  const catBlocks = cats.map(c=>`
    <div>
      <div class="onb-cath">${catIcons[c]} ${c}</div>
      <div class="chips" data-cat="${c}">
        ${genresByCat[c].map(g=>`<button class="chip ${sel.has(g)?'on':''}" data-g="${g}">${g}</button>`).join('')}
      </div>
    </div>`).join('');
  document.getElementById('onbCard').innerHTML = `
    <div class="onb-brand"><span class="dot">D</span> Discover</div>
    <div class="onb-sub">Платформа персональных рекомендаций: фильмы, сериалы, аниме, видеоигры и музыка — подбираются под ваш вкус.</div>
    <div class="onb-step">Шаг 1 · Расскажите о своих вкусах</div>
    <div style="color:var(--muted);font-size:14px;margin-bottom:8px">Выберите любимые жанры в каждой категории — это станет стартовой точкой для персональной ленты. Можно выбрать несколько.</div>
    <div class="onb-cats">${catBlocks}</div>
    <div class="onb-foot">
      <div class="onb-status" id="onbStatus">Выбрано: ${sel.size}</div>
      <div style="display:flex;gap:10px">
        <button class="btn" id="onbSkip">Пропустить</button>
        <button class="btn btn-primary" id="onbGo" ${sel.size<3?'disabled style="opacity:.5;cursor:not-allowed"':''}>Продолжить →</button>
      </div>
    </div>
  `;
  document.getElementById('onb').classList.add('open');
  document.querySelectorAll('.chip').forEach(ch=>{
    ch.addEventListener('click', ()=>{
      const g = ch.dataset.g;
      if(sel.has(g)){ sel.delete(g); ch.classList.remove('on'); }
      else{ sel.add(g); ch.classList.add('on'); }
      const n = sel.size;
      const status = document.getElementById('onbStatus');
      const go = document.getElementById('onbGo');
      status.textContent = `Выбрано: ${n}${n<3?' · нужно минимум 3':''}`;
      if(n>=3){ go.disabled=false; go.style.opacity='1'; go.style.cursor='pointer'; }
      else { go.disabled=true; go.style.opacity='.5'; go.style.cursor='not-allowed'; }
    });
  });
  document.getElementById('onbSkip').addEventListener('click', ()=>{
    state.prefs = {genres: []};
    save(); document.getElementById('onb').classList.remove('open');
    renderSidebar(); renderFeed(); toast('Онбординг пропущен — лента покажет популярное.');
  });
  document.getElementById('onbGo').addEventListener('click', ()=>{
    if(sel.size<3) return;
    state.prefs = {genres: Array.from(sel)};
    save(); document.getElementById('onb').classList.remove('open');
    renderSidebar(); renderFeed(); toast(`Спасибо! Мы подобрали для вас ${topRecommendations(100).length} рекомендаций.`);
  });
}

// ---------- Actions ----------
function toggleLike(id){
  const cur = state.ratings[id];
  if(cur==='like'){ delete state.ratings[id]; toast('Убрали из «Нравится».'); }
  else { state.ratings[id]='like'; toast('♥ Добавлено в «Нравится» — лента обновится.'); }
  save();
  renderSidebar(); renderFeed();
  refreshModalButtons(id);
}
function toggleSave(id){
  if(state.saved[id]){ delete state.saved[id]; toast('Убрали из сохранённого.'); }
  else { state.saved[id]=true; toast('★ Сохранено.'); }
  save();
  renderSidebar(); renderFeed();
  refreshModalButtons(id);
}
function dismiss(id){
  state.seen[id]=true;
  save();
  toast('Учтём — больше не покажем в персональных.');
  closeModal(); renderFeed();
}
function refreshModalButtons(id){
  const m = document.getElementById('modal');
  m.querySelectorAll(`[data-act="like"][data-id="${id}"]`).forEach(b=>{
    b.innerHTML = state.ratings[id]==='like'?'♥ Вам нравится':'♡ Нравится';
  });
  m.querySelectorAll(`[data-act="save"][data-id="${id}"]`).forEach(b=>{
    b.innerHTML = state.saved[id]?'★ Сохранено':'☆ Сохранить';
  });
}

// ---------- Toasts ----------
function toast(msg, ico='✦'){
  const w = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className='toast';
  t.innerHTML = `<span class="ico">${ico}</span><span>${msg}</span>`;
  w.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .25s'; setTimeout(()=>t.remove(),260); }, 2200);
}

// ---------- Events ----------
document.addEventListener('click', e=>{
  const card = e.target.closest('.card');
  const actBtn = e.target.closest('[data-act]');
  const openBtn = e.target.closest('[data-open]');
  if(actBtn){
    e.stopPropagation();
    const id = actBtn.dataset.id; const act = actBtn.dataset.act;
    if(act==='like') toggleLike(id);
    else if(act==='save') toggleSave(id);
    else if(act==='dismiss') dismiss(id);
    return;
  }
  if(openBtn){ openModal(openBtn.dataset.open); return; }
  if(card){ openModal(card.dataset.id); return; }
  if(e.target.id==='modalBg'){ closeModal(); }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
});

document.getElementById('search').addEventListener('input', e=>{
  currentQuery = e.target.value;
  renderFeed();
});
document.getElementById('btnReset').addEventListener('click', ()=>{
  if(confirm('Сбросить вкусы и оценки? Начнём онбординг заново.')){
    state.prefs=null; state.ratings={}; state.saved={}; state.seen={};
    save(); renderSidebar(); renderFeed(); openOnboarding();
  }
});
document.getElementById('btnTop').addEventListener('click', ()=>{
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
  document.querySelector('[data-cat="TOP"]').classList.add('active');
  currentCat='TOP'; renderFeed(); window.scrollTo({top:0,behavior:'smooth'});
});

// ---------- Init ----------
if(!state.prefs){
  openOnboarding();
  renderSidebar();
  renderFeed();
} else {
  renderSidebar();
  renderFeed();
}

</script>
</body>
</html>
